[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextos-cli"
version = "0.2.0"
description = "AI Context Infrastructure Layer - Reduce token consumption. Maintain AI continuity."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["ai", "context", "llm", "token", "memory", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "tiktoken>=0.5.0",
    "mcp>=1.0.0",
]


[project.urls]
Homepage = "https://github.com/Whynotshashwat/ContextOS"
Repository = "https://github.com/Whynotshashwat/ContextOS"
Issues = "https://github.com/Whynotshashwat/ContextOS"

[project.scripts]
context = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "cli*", "utils*", "schemas*", "templates*", "sdk*"]

[tool.setuptools.package-data]
"*" = ["*.json"]