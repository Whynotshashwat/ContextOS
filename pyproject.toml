[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextos"
version = "0.1.0"
description = "AI Context Infrastructure Layer - Reduce token consumption. Maintain AI continuity."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "tiktoken>=0.5.0",
]

[project.scripts]
context = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "cli*", "utils*", "schemas*", "templates*"]

[tool.setuptools.package-data]
"*" = ["*.json"]